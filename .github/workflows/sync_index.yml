# .github/workflows/sync_index.yml
# ─────────────────────────────────────────────────────────────────────────────
# Regenerates index.json and the README.md version tables/badges on every
# push to main. Commits back only if content changed (ignores date-only
# diffs). Consumers fetch index.json on-demand via raw.githubusercontent.com.
# ─────────────────────────────────────────────────────────────────────────────

name: Generate index.json

on:
  push:
    branches:
      - main
    paths:
      - "**/*.SQLite3.gz"
      - ".github/bible_versions_config.yml"
      - "scripts/generate_index.py"
      - "scripts/generate_readme.py"

  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate & commit index.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run generate_index.py
        run: python3 scripts/generate_index.py

      - name: Run generate_readme.py
        run: python3 scripts/generate_readme.py

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: regenerate index.json and README [skip ci]"
            git push
          fi
