# bible_versions_config.yml
# ─────────────────────────────────────────────────────────────
# THIS is the only file you need to edit.
# - Add a new Bible version?        → add entry under languages
# - Add a new consumer repo?        → see consumers block (currently URL-fetch pattern)
#
# The GitHub Action reads this file and does everything else.
# index.json is auto-generated — never edit it manually.
# ─────────────────────────────────────────────────────────────

index:
  output_file: index.json
  base_url: "https://raw.githubusercontent.com/develop4God/bible_versions/main"
  auto_rebuild: true          # rebuild index.json on every push to main

# ── Bible versions ────────────────────────────────────────────
# File naming convention: {VERSION}_{lang}.SQLite3.gz
# Files must exist in the repo under the matching lang/ folder.
# Each version entry: { name: "Display Name", strong: true|false, disclaimer: "..." (optional) }
#   strong     — true if the DB embeds inline Strong's number tags (<S>NNNN</S>) in verse text.
#   disclaimer — optional license/copyright text shown by consumers (app/web) when the user
#                downloads this version on demand. Omit for versions bundled with the app already.

languages:
  en:
    name: "English"
    script: latin
    primary_version: KJV
    fallback_version: NIV
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      KJV: { name: "King James Version", strong: false }
      NIV: { name: "New International Version", strong: false }
      ESV: { name: "English Standard Version", strong: false }

  es:
    name: "Español"
    script: latin
    primary_version: RVR1960
    fallback_version: NVI
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      RVR1960: { name: "Reina-Valera 1960", strong: false }
      NVI: { name: "Nueva Versión Internacional", strong: false }
      NTV: { name: "Nueva Traducción Viviente", strong: false }
      RVR1909: { name: "Reina-Valera 1909 (con Números Strong)", strong: true, disclaimer: "Texto de dominio público (Reina-Valera 1909)." }

  pt:
    name: "Português"
    script: latin
    primary_version: ARC
    fallback_version: NVI
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      ARC: { name: "Almeida Revista e Corrigida", strong: false }
      NVI: { name: "Nova Versão Internacional", strong: false }

  fr:
    name: "Français"
    script: latin
    primary_version: LSG1910
    fallback_version: BDS
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      LSG1910: { name: "Louis Segond 1910", strong: false }
      BDS: { name: "Bible du Semeur", strong: false }
      NBS: { name: "Nouvelle Bible Segond", strong: false }

  ja:
    name: "日本語"
    script: cjk
    primary_version: SK2003
    fallback_version: JCB
    reading_speed: { unit: cpm, rate: 400 }
    versions:
      SK2003: { name: "新改訳2003", strong: false }
      JCB: { name: "リビングバイブル", strong: false }

  zh:
    name: "中文"
    script: cjk
    primary_version: CUV1919
    fallback_version: CNVS
    reading_speed: { unit: cpm, rate: 400 }
    versions:
      CUV1919: { name: "和合本1919", strong: false }
      CNVS: { name: "新译本", strong: false }

  hi:
    name: "हिन्दी"
    script: devanagari
    primary_version: HIOV
    fallback_version: HERV
    reading_speed: { unit: wpm, rate: 180 }
    versions:
      HIOV: { name: "पवित्र बाइबिल (ओ.वी.)", strong: false }
      HERV: { name: "पवित्र बाइबिल", strong: false }

  de:
    name: "Deutsch"
    script: latin
    primary_version: LU17
    fallback_version: SCH2000
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      LU17: { name: "Luther 2017", strong: false }
      SCH2000: { name: "Schlachter 2000", strong: false }

  ar:
    name: "العربية"
    script: arabic
    primary_version: NAV
    fallback_version: SVDA
    reading_speed: { unit: wpm, rate: 150 }
    versions:
      NAV: { name: "الترجمة العربية الجديدة", strong: false }
      SVDA: { name: "ترجمة سميث وفاندايك", strong: false }

  fil:
    name: "Filipino"
    script: latin
    primary_version: MBB05
    fallback_version: ASND
    reading_speed: { unit: wpm, rate: 200 }
    versions:
      MBB05: { name: "Magandang Balita Biblia", strong: false }
      ASND: { name: "Ang Salita ng Dios", strong: false }

# ── Consumers ─────────────────────────────────────────────────
# index.json is fetched on-demand via URL — no sync needed.
# Each consumer repo defines one constant:
#
#   BIBLE_INDEX_URL = "https://raw.githubusercontent.com/develop4God/bible_versions/main/index.json"
#
# To activate cross-repo sync in the future, uncomment and configure:
#
# consumers:
#   - name: DevocionalesAPI
#     repo: develop4God/DevocionalesAPI
#     branch: main
#     target_path: bible_config/index.json
#     trigger: on_index_change
#
#   - name: Devocionales-json
#     repo: develop4God/Devocionales-json
#     branch: main
#     target_path: bible_config/index.json
#     trigger: on_index_change
#
#   - name: devocional_nuevo
#     repo: develop4God/devocional_nuevo
#     branch: main
#     target_path: assets/bible_config/index.json
#     trigger: on_index_change
